[package]
name = "walt"
version = "0.10.0"
edition = "2021"
license = "MIT"
description = "Wallpaper manager for Hyprland with TUI and GUI interfaces"
repository = "https://github.com/gitfudge0/walt"
homepage = "https://github.com/gitfudge0/walt"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
ratatui-image = { version = "5.0", features = ["crossterm"] }
eframe = { version = "0.33.3", default-features = false, features = [
  "default_fonts",
  "glow",
  "wayland",
  "x11",
] }
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "webp",
] }
dirs = "5.0"
walkdir = "2.5"
anyhow = "1.0"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
percent-encoding = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[profile.release]
opt-level = 3
lto = true
